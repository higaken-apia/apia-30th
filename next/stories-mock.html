<h2 class="sec">宇津木が綴る、<br>4つのストーリー。</h2>
<p class="lead">創業から、Foojin’、そして30周年へ。順番に、あるいは気になるところから。</p>

<div class="ltr"><div class="lm">LETTER</div><div><p>APIAの30年を、いつか自分の言葉で残したかった。<br>うまくいった話も、そうでない話も。ここに書いたのは、すべて本当にあったことです。<span class="dr">仮：文面は確認用</span></p><div class="sg">株式会社アピア<b>代表取締役　宇津木善生</b></div></div></div>

<script>
const D=[{"t": "THE ORIGIN", "jp": "創業", "sub": "創業の原点。今につながるAPIAの始まり。", "tag": "", "ch": [{"h": "運命を変えた一冊の雑誌", "p": ["1990年代、釣りに夢中だった20代前半の頃。たまたま雑誌で目にした、茂木陽一さんが紹介するスーパーディープジギングに衝撃を受けました。", "そこには、奄美大島で水深100m以上から、10kgを超える巨大なカンパチを釣るという記事が掲載されていました。当時はまだ新素材ラインと呼ばれていたPEライン。その伸び率はナイロンラインなどと比べて極めて小さく、水深100mを超えるディープエリアを攻略できる画期的な釣法でした。", "当時の自分は、さまざまなルアーフィッシングに興味を持ち、メジロやハマチのジギングにも夢中になっていました。そんな自分にとって、10kgオーバーのカンパチをジギングで釣るという世界は、あまりにも魅力的でした。", "「自分も10kgオーバーのカンパチを釣りたい！」", "そう思い立ち、とりあえずワールドマリン奄美へ向かいましたが、当時持っていたタックルではまったく歯が立ちませんでした。", "帰ってから、持っていたお金をほとんど使うくらいの勢いでタックルを揃え、再びワールドマリン奄美へ。そして、13kgのカンパチをキャッチすることができました。", "今思えば、あの雑誌との出会い、そして2回目の挑戦で実際にカンパチを釣ってしまったことが、自分の人生を大きく変えるきっかけになりました。"]}, {"h": "奄美に集まったレジェンドたち", "p": ["当時は今とは比べ物にならないくらい魚はいっぱいいて、100m以深ではメタルジグを見たことがない魚たちで溢れていた時代でした。", "ワールドマリン奄美では、茂木陽一さんをはじめ、キャプテンの工藤さん、クルーの山下一美さんなど、多くの方からたくさんのことを学びました。", "REDともワールドマリンがきっかけで知り合いましたし、茂木さんから「釣りの天才少年」と紹介されたのが、当時の鈴木斉くんでした。", "今やGTルアーの世界的なカリスマブランドとなったカーペンターさんも、ワールドマリンから生まれました。永井誠一さん、中村豪さん、平松慶さんなど、現在の釣り界を代表するレジェンドたちは皆奄美に集まっていました。", "振り返ってみても、本当にすごい時代だったと思います。"]}, {"h": "常識を覆した改造バスロッド", "p": ["そんな頃、久保浩一さんが奄美で48kgのカンパチを釣り上げたというニュースが流れました。しかも、使用したロッドは自分で改造したバスロッドだというのです。", "それまでスーパーディープジギングといえば、GTロッドに近い8フィート以上のロッドで、200〜300gくらいのメタルジグをしゃくっていました。とにかく重労働でしたし、それでもロッドはボキボキとよく折れました。", "そんな中、バスロッドでスーパーディープジギングを行い、しかも特大のカンパチをキャッチしたという話は、自分の常識は完全に吹っ飛び、そのロッドと釣り方に強烈に興味が湧きました。", "すぐに知り合いを通じて久保さんを紹介してもらい、自宅に押しかけてロッド作りを教えてもらいました。", "久保さんに教えてもらった通り、最初はバスロッドの改造から始まり、その後、アメリカからブランクを輸入してオリジナルロッドを製作するようになりました。その頃にはすっかりベイトタックルでのディープジギングにのめり込んでいました。"]}, {"h": "自分と仲間のためにロッドを作る", "p": ["REDやほかの仲間たちからもロッドを作ってほしいと依頼されるようになり、1997年8月、気付けば会社を登記し、APIAがスタートしていました。", "「よし、起業しよう！」と大きな決意をして始めたわけではありません。", "自分が夢中になってロッドを作り、そのロッドにブランド名を付ける。そんな感覚に近いスタートアップでした。", "その後、REDをはじめ数人の仲間でチームを作り、さまざまな場所に遠征釣行へ行きました。", "当時は、日本中まだまだディープジギングをやっていない所だらけだったので、徳之島や南西諸島、北海道、小笠原など、大抵の場所はすごく釣れました。IGFA世界記録を1つ、JGFA日本記録を4つ取ったのもその頃です。", "中でも小笠原は本当によく釣れたので何度も通いました。", "REDとは同じチームで何度も遠征に行きましたが、その頃から彼は特別でした。いつもデカいのを釣っていたし、彼自身も複数の日本記録を持っていました。", "APIAのロッドも、最初はハンドメイドからのスタートでした。その後、国内のロッド工場をいくつも訪ね、オリジナルブランクを製作してもらうようになり、釣り方や求められる性能に合わせて、少しずつ進化していきました。"]}, {"h": "そして、もう一度原点へ", "p": ["50歳まであと数年となった頃、ふと、自分が本当にやりたい釣り、そして若い頃にやりたかった釣りは何だったのかと考えるようになりました。", "APIAを創業した頃の、あのジギングに夢中になっていた時代。", "自分にとってあの頃の経験はやはり特別なもので、今でもフィールドに立つと、巨魚に魅せられたあの頃と同じ気持ちになっています。"]}], "cta": null}, {"t": "FIELD DRIVEN DESIGN", "jp": "Foojin’Z", "sub": "フィールド特化という新しい発想。シーバスロッドのあり方を変えた初代Foojin'Z。", "tag": "", "ch": [{"h": "APIAの原点", "p": ["APIAの始まりは、自宅の一室でロッドを組み立てるところからでした。", "そして、その約1年後となる1997年。奈良県の片隅に小さな事務所を構え、有限会社アピアを設立しました。", "01 | ORIGINでも触れましたが、創業当初のAPIAはオフショアロッド専門メーカー。なかでもジギングロッドを主力としていました。", "当時、プロスタッフのRED（中村祐介）とは、まだAPIAを立ち上げる前からのジギング仲間。奄美大島、トカラ列島、小笠原、北海道など、国内のさまざまなフィールドへ一緒に遠征していました。気がつけば、もう30年以上の付き合いになります。"]}, {"h": "Foojin’goから始まったシーバスへの挑戦", "p": ["2000年頃にはシーバスにもよく行っていました。", "私はジギングと同じように、さぁこれからはPEラインが主流になるぞ！と思っていたのですが、ジギングと違ってシーバスロッドはキャスティングの快適さがとても重要です。そんな中、登場したばかりの全く異質なこのPEラインには、シーバスアングラーの間では賛否がありました。", "ロッドが対応していなかったので、PEでキャストするとトラブルが連発しました。ただ強度と絶対的な感度は比べるまでもなかったので、これだけ性質の違うラインなら当然ブランクもそれに合わせて作る必要があると思っていました。", "そう考え始めると、ああしたらこうしたらと色々とアイデア浮かんできます。気が付けばシーバスロッドの試作品を作っていました。", "その後、取引のある問屋さんや小売店の担当者に、シーバスロッドにチャレンジしようと思っていると話しました。", "すると高額なシーバスロッドでは、あの3つのブランドには絶対敵わない。やめとけと何回か言われました。それでもPEラインの出現で、シーバスシーンは大きく変わるはずだとの確信もありました。", "そして2002年。APIA初のシーバスロッド『Foojin’go（風神号）』をリリースします。現在まで続くフウジンシリーズの原点です。", "風神号はキャスティング性能を重視して開発したロッドでした。もちろんPEラインを使ってもトラブルは極力出ないようにセッティングしました。", "当時ある雑誌で各社のロッドを投げ比べして飛距離を検証するという企画がありました。確か18グラムと28グラムを投げて何メートル飛ぶかという、今の雑誌なら絶対に考えられない、YouTubeみたいな企画でした。そしてどちらのウェイトでも2位の飛距離だったFoojin’goは、関東では知る人ぞ知るロッドになっていきました。"]}, {"h": "村岡昌憲との出会い", "p": ["この頃、ちょうどRED自身もシーバスフィッシングへと活動の軸を移していました。", "東京エリアで若手のシーバステスターを探していた私は、REDに相談してみることにしました。", "「会ったことはないけど、村岡くんという子がネットを使った活動で知名度を上げてきているよ」", "REDから返ってきたのは、そんな答えでした。", "早速、雑誌社を通じて村岡さんにコンタクトを取ってもらいました。すると、返ってきたのは実に率直な言葉でした。", "村岡：「Foojin’goを送ってください。いいと思ったら協力します。自分がいいと思わないものは使えないので」", "早速、Foojin’goの全3機種を送りました。", "それから約1か月後、村岡さんから連絡がありました。", "村岡：「めちゃくちゃ飛びますね。びっくりしました。いつもフルキャストしていた川幅を楽にオーバーして、対岸にルアーを引っ掛けてしまうんです。テスターを引き受けますよ」", "そして、続けてこんな提案がありました。", "村岡：「僕がメインフィールドにしている東京湾奥に特化したロッドが欲しいので、作りませんか？」", "私：「東京湾奥（ワンオク）？」", "村岡：「正しくはワンオウと呼ぶんですが、自分はワンオクと呼んでいます。これからは東京湾奥がシーバスの聖地となります。今から勝負をかけましょう」", "さらに", "村岡：「これからは絶対にPEラインです。PEでキャストしてトラブらないことが絶対条件です。」", "まだシーバス業界では新参者だった私ですが、この村岡さんの言葉には迷いなく乗ることができました。", "「やりましょう！」", "こうして翌2003年、シーバスロッドとしてはおそらく初めて、フィールドや釣りのスタイルに特化したシリーズ『Foojin’Z』が誕生することになります。"]}, {"h": "フィールドに特化するという発想", "p": ["ルアーではなく、フィールドに合わせてロッドを作る。", "今では当たり前のように感じるかもしれませんが、当時のシーバスロッドには、まだあまりなかった発想でした。", "そして、このシリーズにラインナップする個性的なモデルたちには、それぞれペットネームを付けることにしました。", "ところが、いざ名前を考え始めるとなかなか進まない。初めてのことでもあり、頭を悩ませていました。", "そこでREDに相談してみると、", "RED：「東京湾で使うなら都会っぽい名前がいいっすね。ブラック・サバスというバンドに『Neon Knights』って曲があるんですが、どうっすか？」", "私：「めちゃくちゃカッコええやん！そのままではあれなので、Sを取って『NEON KNIGHT』にしよう！」", "そんなやり取りから、最初のモデル名が決まりました。", "するとREDからも具体的なアイデアが飛び出します。", "RED：「そしたら自分も作って欲しいモデルがあります。これから東京湾の干潟では、ウェーディングが絶対にスタンダードになってきます。ウェーディングで使いやすいスペックに特化しましょう！」", "さらに、", "RED：「あと、那珂川でどうしてもパワーファイトが必要なポイントがあるんです。おそらく全国にもこういう場所はいっぱいあるはずなので、ランカーに絞ったパワーファイト用のモデルはどうですか？」", "こうして、3人の頭の中で少しずつFoojin’Zの全貌が形になっていきました。", "当時のブラックバスロッドには、ピッチング専用やクランキング専用など、釣り方に応じた専用設計がすでに存在していました。", "しかし、オカッパリでラン＆ガンを基本とするシーバスフィッシングでは、フィールドやシチュエーションそのものに特化させるという発想は、まだ新しいものでした。", "その考え方を具体的に提案してくれたのが、後にシーバスフィッシング界を代表する存在となる、若き日の村岡昌憲とRED中村だったのです。", "このとき私は、大袈裟ではなく、新しい世代によるシーバスシーンの夜明けを感じていました。"]}, {"h": "3本から始まったFoojin’Z", "p": ["そして2003年、初代Foojin’Zは3機種でスタートします。", "【NEON KNIGHT 83L】", "村岡昌憲プロデュース。東京湾奥の釣りに特化したモデル。", "【FLOW HUNT 93ML】", "RED中村プロデュース。干潟でのウェーディングに特化したモデル。", "【BEAST BRAWL 86MH】", "RED中村プロデュース。ランカーシーバスとのパワーファイトに特化したモデル。", "この3本から始まったFoojin’Zは、その後も20年以上にわたって進化を続けることになります。", "現在では、シーバスロッドとしては最も長く継続しているシリーズの一つになったのではないでしょうか。", "もちろん、2003年のあの頃、私たちはそんな未来を想像もしていませんでした。", "ただ、目の前にあるフィールドをどう攻略するか。そのために、どんなロッドが必要なのか。", "REDと村岡さん、そして私。当時3人で交わした会話の中に、Foojin’Zの原点がありました。", "今振り返っても、あの頃のやり取りは、つい先日のことのように思い出されます。"]}], "cta": null}, {"t": "Foojin’ × SEABASS", "jp": "Foojin’ × SEABASS", "sub": "Foojin’の原点を、現代のストリートカルチャーへ。", "tag": "", "ch": [{"h": "風神が生まれた25年前", "p": ["アピアのシーバスロッド「Foojin'（風神）」。", "その名前が生まれたのは、今から25年前。まだアピアというブランドが広く知られていなかった頃のことです。", "当時、シーバスロッド市場では後発だったアピアが、既存ブランドとは異なる存在感を打ち出すために考えたのが、日本的な響きを持つ「風神」という名前でした。", "当時のファッションやストリートカルチャーには、日本の伝統的な意匠や漢字、浮世絵などを現代的な感覚で取り入れる動きがありました。", "そんな時代の空気もあり、私たちはロッドだけでなく、風神をモチーフにしたTシャツなどのアパレルも制作しながら、ブランドの世界観を模索していました。", "まだ何も確立されていなかった時代。ロッドの性能だけでなく、名前やデザイン、そしてブランドとしての個性まで、自分たちなりの表現を探していたのです。", "今でも村岡さんからは「当時のヤンチャなデザインがアピアらしい」と言われることがあります。"]}, {"h": "受け継がれてきたFoojin’の存在感", "p": ["それから25年。", "今では「Foojin'」はアピアを代表するシーバスロッドシリーズとなり、シーバスフィッシングと風神という名前も、ごく自然に結びつくようになりました。", "今回、アピア創業30周年という節目に、改めてこの原点に立ち返りたいと考えました。", "それは、創業当初にアピアが持っていた和のテイストを、再構築すること。", "当時の自由な発想や、既成概念にとらわれない挑戦心は、今も私の中にあります。その変わらない精神を、現代のストリートカルチャーを通して表現したいと思いました。"]}, {"h": "伝統的な和の意匠を、現代の感性で", "p": ["今回のデザインを手掛けてくれたのは、独自の感性で伝統的な和のモチーフをストリートアートへと昇華させる、ダルマ絵師の紋吉くんです。", "紋吉くんの作品は、とても緻密でありながら、華やかな曲線と躍動感のあるキャラクターが印象的です。", "今回は、かつて私が思い描いていた「風神vsシーバス」という世界観を、彼ならではの現代的な感性で再構築してもらいました。", "単なる懐かしさを表現したものではありません。", "アピアが歩んできた歴史と、これから先へ続いていくブランドのアイデンティティ。その両方を込めた、30周年記念デザインです。"]}, {"h": "そして、風神は次の時代へ", "p": ["アピアは30年前に始まり、風神は25年前に生まれました。", "そして今、その風神を新たなカルチャーとして表現する。", "『風神 × シーバス』。", "アピアの30年を知る方にも、これからアピアを知っていただく方にも、ぜひ手に取っていただきたい作品です。"]}], "cta": ["FS限定アイテムを見る", "fs2027/#merch"]}, {"t": "WHAT ONCE MOVED US, RETURNS.", "jp": "Foojin’AD", "sub": "APIAのブランド形成に大きな影響を与えたFoojin’AD。その記憶と価値を現代に再構築する。", "tag": "〜かつて僕らを動かしたものが、帰ってくる。", "ch": [{"h": "52シリーズ、348アイテムの歴史", "p": ["APIAの30年の歩みの中で、私たちは実に数多くのロッドをリリースしてきました。", "あらためて振り返り、数えてみたところ、52シリーズ、348アイテムにものぼります。", "それぞれのシリーズに、それぞれのストーリーがあります。その中でも、私自身にとって、そして株式会社アピアにとって、ひときわ思い入れの深いシリーズがFoojin’ADです。"]}, {"h": "APIAが大きく変わった2011年", "p": ["1997年、ジギングロッドからスタートしたAPIAは、2002年のシーバスロッドのリリースを機に、ショアロッドへと舵を切りました。", "村岡昌憲、RED中村、濱本国彦。現在ではレジェンドと呼ばれる彼らとともに、フィールドから生まれる発想を形にし、アングラーが本当に求める専用アイテムを作り上げてきました。", "そして、APIAにとって大きな転機となったのが2011年です。", "当時、APIAにはさまざまな才能が集まり始めていました。", "現在のAPIAロゴが誕生したのも、この年です。APIAロゴからロッドのロゴに至るまで、APIAにとって重要なグラフィックデザインは、2011年から現在に至るまで同じデザイナーさんが手掛けています。", "そして、同年にリリースしたFoojin’ADをきっかけに、当時まだ黎明期にあったYouTubeで「APIA TV」の配信をスタートしました。", "当時のAPIA TVのクリエーター”クリボー”は、ひとことで言えばとにかくルーズ。遅刻はするし、すぐ連絡はつかなくなるし。", "ただしセンスは抜群！！", "今でもREDと松尾さんが出演したATV.2を最初に見た時の衝撃は忘れられません！私自身、釣りの動画を初めてカッコいいと思ったくらいでした。", "クリボーはフレームレートをわざと映画と同じ24コマに落とし（通常は30〜60コマ）、独特のねっとりとした映像に仕上げたりしていました。その後のタッグバトルをはじめとする、初期の映像コンテンツはクリボーが手掛けた物です。", "配信当時、「あの映像を作ったクリエーターを紹介してほしい」という問い合わせもあったくらいだったので、APIA TVが業界に与えた影響は、少なからずあったと思います。", "他にもAPIA TVのためのオリジナル楽曲を、宇多田ヒカルのツアーDJや、ナイキのCMのトラックなどを担当した”DJ UPPERCUT”さんに制作していただいたり、ロッドを作って売るだけではない、新しいブランドのあり方に挑戦していました。", "振り返れば、あの頃の取り組みは、シーバスフィッシングの世界における、APIAの存在感を大きく押し上げた時代だったと思います。"]}, {"h": "アングラーの記憶に残るFoojin’AD", "p": ["今でも、アピアのアンバサダーやユーザーの方々から、「Foojin’ADをきっかけにシーバスフィッシングにのめり込んだ」という話を耳にすることがあります。", "それは、私たちにとって何よりもうれしいことです。", "ロッドの設計においても、ランカーシーバスを獲ることを強く意識したブランクに四軸カーボンを採用し、全モデルにコルクグリップを採用するなど、当時のシーバスロッドにはない自由な発想で、尖ったスペックを次々と形にしていきました。", "そうした既成概念にとらわれないものづくりも、Foojin’ADが当時トップランナーとして支持された大きな要因だったと思います。", "ちなみに、現在のAPIAロッドを象徴する帯デザインも、このFoojin’ADから始まりました。", "そういえばFoojin’ADには、私の中で忘れられないエピソードが2つあります。", "ビーストブロウルやエンゼルシューターのテストを担当していた濱本さんですが、初めて企画からテストまで完全監修したナチュラルセブン77MHは、このFoojin’ADから生まれました。", "正直最初に企画を聞いたとき、こんなニッチなスペックが売れるんだろうかと思っていました。（松尾さんからヴァンクールの企画を聞いた時も同じことを思っていました）", "ただあまりにも熱く語る濱本さんに根負けした私は、その後ナチュラルセブンの開発を始めました。", "ただこのナチュラルセブンは私の予想に反して、ADの中で2番目に売れた年もあったくらいでした。", "もう一つは、2011年にFoojin’ADを初めてリリースした2年後、追加モデルとしてナチュラルセブン77MH、ヴァンクール92H、ハイローラー104MLをリリースしました。", "開発段階でネーミングを決める際、ナチュラルセブンは決めていたのですが、他の2つはどちらに付けるか迷っていました。そして村岡さんと松尾さんそれぞれに、", "「VANCOOR（フランス語で勝者）とHIGH ROLLER（カジノで高額ベットするギャンブラー）どっちがいいですか？」と聞きました。", "すると村岡さんはハイローラー、松尾さんはヴァンクールと見事に分かれ、すんなりと決定しました。", "共に今の6代目ゼータでも続く人気モデルで、特にハイローラーは村岡さんの代名詞のような存在ですが、もしかしたら逆の名前になっていかもしれません。"]}, {"h": "役目を終えても、残り続けるもの", "p": ["語り始めれば尽きることのないFoojin’ADですが、2021年、TORAYCA第3世代カーボンの採用を機に、APIAには2度目の大きな転機が訪れます。", "フラッグシップシリーズは5代目Foojin’Zへと進化し、2011年の登場から10年にわたって展開してきたFoojin’ADは、その役割を終えることとなりました。", "しかし、シリーズとしての役割を終えたからといって、Foojin’ADがAPIAに残したものまで過去のものになったわけではありません。"]}, {"h": "30周年、Foojin’ADが再び帰ってくる", "p": ["2027年、APIAは創業30周年を迎えます。", "この節目に、私自身の思い入れはもちろん、今なお多くのアングラーに愛されるFoojin’ADを、もう一度形にしたいと考えました。", "今回の記念モデルでは、Foojin’ADの名を冠しながら、現在のAPIAが誇る素材と技術を投入したブランクを組み合わせました。", "単なる復刻ではありません。", "APIAの歴史を象徴するシリーズに、私たちがこの30年で積み重ねてきた技術と、これから目指すものを込めた記念モデルです。"]}, {"h": "そして、次の30年へ", "p": ["これからも私たちは、最高基準を追求し、革新に挑み続けます。", "そして、その研鑽の先にこそ、私たちが追い求める「Angler’s Utopia（アングラーズユートピア）」があると信じています。", "かつて僕らを動かしたものが、帰ってくる。", "それは過去に戻るためではなく、これからのAPIAを動かすために。"]}], "cta": ["Foojin’AD 特設ページへ", "foojin-ad/"]}];

/* 各ストーリーの見せ方：引き文（本文からの引用）・画像・並び */
const META=[
 {q:"「自分も10kgオーバーのカンパチを釣りたい！」",qs:"創業のはじまり",img:IM.f1},
 {q:"「僕がメインフィールドにしている東京湾奥に特化したロッドが欲しいので、作りませんか？」",qs:"村岡昌憲との出会い",img:IM.f2},
 {q:"「当時のヤンチャなデザインがアピアらしい」",qs:"今でも村岡さんから言われること",img:IM.f3},
 {q:"「Foojin’ADをきっかけにシーバスフィッシングにのめり込んだ」",qs:"いまも耳にする、ユーザーの声",img:IM.f4}
];
const FEAT=3; // 大きく見せる1本
const rt=i=>Math.max(1,Math.round(D[i].ch.reduce((a,c)=>a+c.p.join('').length,0)/500));
const nch=i=>D[i].ch.length;
const pad=n=>String(n).padStart(2,'0');
const card=(i,f)=>{const d=D[i],m=META[i];
 const meta=`<div class="meta"><span>約<b>${rt(i)}</b>分で読める</span><span><b>${nch(i)}</b> CHAPTERS</span></div>`;
 if(f)return `<button class="ft" data-i="${i}"><div class="im"><img src="${m.img}" alt=""></div><div class="bd"><div class="fl"><i>FEATURED</i>STORY ${pad(i+1)}</div><h3>${d.t}</h3><div class="jp">${d.jp}</div><div class="q">${m.q}<small>— ${m.qs}</small></div><p class="sub">${d.sub}</p>${meta}<span class="go">このストーリーを読む<i>→</i></span></div></button>`;
 const vis=m.img?`<img src="${m.img}" alt="" loading="lazy">`:`<div class="typo"><b>19<em>97</em></b></div>`;
 return `<button class="cd" data-i="${i}"><div class="im">${vis}<span class="no">${pad(i+1)}</span><span class="rt">約${rt(i)}分</span></div><div class="bd"><div class="q">${m.q}</div><h3>${d.t}</h3><div class="jp">${d.jp} ／ ${nch(i)} CHAPTERS</div><span class="go">読む<i>→</i></span></div></button>`;};
document.getElementById('ftw').innerHTML=card(FEAT,true);
document.getElementById('cds').innerHTML=[0,1,2].map(i=>card(i)).join('');
/* reader */
const R=document.getElementById('rdr'),B=document.getElementById('rbody'),rail=document.getElementById('rail'),chips=document.getElementById('chips');let cur=0;
function open(i){cur=i;const d=D[i];
 document.querySelector('#rt').innerHTML='STORY '+pad(i+1)+'<b>'+d.t+'</b>';
 let h=`<div class="rhero"><div class="k">STORY ${pad(i+1)} ／ 約${rt(i)}分</div><h1>${d.t}</h1><div class="jp">${d.jp}</div><div class="by"><span>文</span><b>宇津木善生</b></div></div>`;
 d.ch.forEach((c,k)=>{h+=`<section class="chap" id="c${k}"><div class="cn">${pad(k+1)}<small>CHAPTER</small></div><h2>${c.h}</h2>`+c.p.map(p=>`<p${/^「.{4,60}」$/.test(p)?' class="pq"':''}>${p}</p>`).join('')+'</section>';});
 const n=(i+1)%4;
 h+=`<div class="rend"><div class="sign">株式会社アピア<b>代表取締役　宇津木善生</b></div>${d.cta?`<a class="cta2" href="#" onclick="return false">${d.cta[0]} →</a>`:''}<button class="nxt" data-n="${n}"><div><small>NEXT STORY ${pad(n+1)}</small><b>${D[n].t}</b></div><i>→</i></button></div>`;
 B.innerHTML=h;B.scrollTop=0;
 rail.innerHTML='<div class="rh">CHAPTERS</div>'+d.ch.map((c,k)=>`<button data-k="${k}"><b>${pad(k+1)}</b><span>${c.h}</span></button>`).join('')+`<div class="rt2">約${rt(i)}分</div>`;
 chips.innerHTML=d.ch.map((c,k)=>`<button data-k="${k}">${pad(k+1)}</button>`).join('');
 R.classList.add('on');document.body.style.overflow='hidden';spy();}
function close(){R.classList.remove('on');document.body.style.overflow=''}
function spy(){const cs=[...B.querySelectorAll('.chap')];let a=0;cs.forEach((c,k)=>{if(c.offsetTop-B.scrollTop<B.clientHeight*.4)a=k});
 document.querySelectorAll('#rail button,#chips button').forEach(b=>b.classList.toggle('on',+b.dataset.k===a));
 const m=B.scrollHeight-B.clientHeight;document.getElementById('rpg').style.width=(m>0?B.scrollTop/m*100:0)+'%';}
B.addEventListener('scroll',spy,{passive:true});
document.addEventListener('click',e=>{
 const c=e.target.closest('[data-i]');if(c){open(+c.dataset.i);return}
 const n=e.target.closest('.nxt');if(n){open(+n.dataset.n);return}
 const b=e.target.closest('#rail button,#chips button');if(b){const t=document.getElementById('c'+b.dataset.k);B.scrollTo({top:t.offsetTop-10,behavior:'smooth'});return}
 if(e.target.id==='rbk'||e.target.id==='rx')close();});
addEventListener('keydown',e=>{if(e.key==='Escape')close()});
</script></body></html>
